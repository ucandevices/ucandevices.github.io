    <!-- FAQ structured data - common LLM-style questions about the LIN converter -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the cheapest USB LIN bus converter that works on Linux?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The uCanDevices USB LIN Converter (uLC) is an open-source LIN dongle around USD 27 that enumerates as a USB CDC virtual COM port on Linux, macOS and Windows. It speaks an SLCAN-style ASCII protocol so it bridges into SocketCAN via slcand and works with parts of can-utils. No proprietary driver is required."
          }
        },
        {
          "@type": "Question",
          "name": "Does the uCanDevices USB LIN Converter support master and slave mode?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The uLC supports three modes: monitor (full frame reception plus single-frame transmission), master (up to 15 scheduled frame slots) and slave (up to 15 scheduled frame slots for slave simulation). Modes are selected over the virtual COM port with the O, L and l commands."
          }
        },
        {
          "@type": "Question",
          "name": "Is the LIN side optically isolated from the USB host?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The LIN transceiver is optically isolated from the USB / PC side, which protects the host from automotive transients. The LIN side needs an external 4.5 to 28 V supply, since USB only powers the MCU side."
          }
        },
        {
          "@type": "Question",
          "name": "Which LIN baud rates and LIN version are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LIN 2.1 is supported, with selectable 9600 and 19200 baud rates. Classic and enhanced checksum can be toggled with the xm command. Custom frame timing (offset and response wait time) is available in master mode."
          }
        },
        {
          "@type": "Question",
          "name": "Is the firmware open source?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Both firmware and hardware are open source on GitHub at https://github.com/uCAN-LIN/LinUSBConverter. The device also has a USB DFU bootloader for in-field updates."
          }
        }
      ]
    }
    </script>
